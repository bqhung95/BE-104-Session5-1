spring.application.name=api-gateway

server.port=8080



# Cấu hình Định tuyến tĩnh (Static Routing)
spring.cloud.gateway.server.webflux.routes[0].id=customer-service-route
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/customers/**
